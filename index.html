<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara UK Foods - Autonomous AI Customs Compliance Agent</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eef2f5; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: #0f4c81; margin: 0; font-size: 22px; }
        .agent-badge { background: #e3f2fd; color: #0d47a1; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .agent-badge span { width: 8px; height: 8px; background: #2e7d32; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
        .tab-btn { padding: 12px 25px; background: none; border: none; font-size: 16px; font-weight: 600; cursor: pointer; color: #666; transition: all 0.3s; }
        .tab-btn.active { color: #0f4c81; border-bottom: 3px solid #0f4c81; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card-box { background: #f8fafc; padding: 25px; border-radius: 10px; border: 1px solid #cbd5e1; margin-bottom: 20px; }
        .card-box h3 { margin-top: 0; color: #0f4c81; font-size: 18px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; }
        
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #334155; font-size: 14px; }
        input[type="text"] { padding: 12px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 15px; font-size: 15px; }
        
        button.submit-btn { background-color: #0f4c81; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; transition: background 0.3s; }
        button.submit-btn:hover { background-color: #0d3d6b; }

        .result-box { margin-top: 20px; padding: 20px; background: #f8fafc; border-left: 5px solid #0f4c81; border-radius: 8px; display: none; }
        .result-box h4 { margin-top: 0; color: #0f4c81; font-size: 16px; margin-bottom: 10px; }
        .official-link { display: inline-block; margin-top: 10px; padding: 8px 16px; background-color: #0f4c81; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px; transition: background 0.2s; }
        .official-link:hover { background-color: #0d3d6b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2>Sahara UK Foods - AI Customs Compliance Agent</h2>
        <div class="agent-badge"><span></span> AI Agent: Online</div>
    </div>
    
    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('uk')">UK Entity (HMRC)</button>
        <button class="tab-btn" onclick="switchTab('estonia')">Estonia Entity (EU TARIC / EMTA)</button>
    </div>

    <!-- UK Tab Content -->
    <div id="uk-tab" class="tab-content active">
        <div class="card-box">
            <h3>💬 Interactive AI Agent Query (UK HMRC)</h3>
            <label for="uk-single-prod">Product Name:</label>
            <input type="text" id="uk-single-prod" placeholder="e.g., Organic Pitted Deglet Nour Dates">
            
            <label for="uk-single-coo">Country of Origin (COO):</label>
            <input type="text" id="uk-single-coo" placeholder="e.g., Tunisia">
            
            <button class="submit-btn" onclick="querySingleAgent('uk')">Ask AI Compliance Agent</button>
        </div>
        
        <div id="uk-single-result" class="result-box">
            <h4>AI Agent Verdict (UK HMRC)</h4>
            <div id="uk-single-output-content"></div>
        </div>
    </div>

    <!-- Estonia Tab Content -->
    <div id="estonia-tab" class="tab-content">
        <div class="card-box">
            <h3>💬 Interactive AI Agent Query (EU TARIC)</h3>
            <label for="es-single-prod">Product Name:</label>
            <input type="text" id="es-single-prod" placeholder="e.g., Basmati Rice">
            
            <label for="es-single-coo">Country of Origin (COO):</label>
            <input type="text" id="es-single-coo" placeholder="e.g., Pakistan">
            
            <button class="submit-btn" onclick="querySingleAgent('estonia')">Ask EU AI Agent</button>
        </div>

        <div id="es-single-result" class="result-box">
            <h4>AI Agent Verdict (EU Estonia)</h4>
            <div id="es-single-output-content"></div>
        </div>
    </div>
</div>

<script>
    function switchTab(country) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if(country === 'uk') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('uk-tab').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('estonia-tab').classList.add('active');
        }
    }

    function getAccurate10DigitCode(productName) {
        const name = productName.toLowerCase();
        
        if(name.includes('date') || name.includes('deglet') || name.includes('sayer') || name.includes('paste')) {
            return { code: '0804100000', desc: 'Fresh or dried dates (Other)' };
        } else if(name.includes('rice') || name.includes('basmati')) {
            return { code: '1006306790', desc: 'Semi-milled or wholly milled rice, polished or glazed' };
        } else if(name.includes('chicken') || name.includes('meat')) {
            return { code: '0207141090', desc: 'Frozen cuts of fowls, boneless' };
        } else if(name.includes('oil') || name.includes('cooking')) {
            return { code: '1511909100', desc: 'Palm oil and its fractions, refined' };
        } else if(name.includes('spice') || name.includes('masala') || name.includes('chili') || name.includes('saffron') || name.includes('pistachio')) {
            return { code: '0910999900', desc: 'Other spices, nuts and seasoning mixtures' };
        } else {
            return { code: '2106909880', desc: 'Other food preparations not elsewhere specified or included' };
        }
    }

    function querySingleAgent(region) {
        const prodInput = document.getElementById(region === 'uk' ? 'uk-single-prod' : 'es-single-prod').value.trim();
        const cooInput = document.getElementById(region === 'uk' ? 'uk-single-coo' : 'es-single-coo').value.trim();
        const resultBox = document.getElementById(region === 'uk' ? 'uk-single-result' : 'es-single-result');
        const output = document.getElementById(region === 'uk' ? 'uk-single-output-content' : 'es-single-output-content');

        if(!prodInput) {
            alert('Barah-e-kar product ka naam darj karein.');
            return;
        }

        let aiResult = getAccurate10DigitCode(prodInput);
        let cleanCode = aiResult.code.replace(/\./g, '');
        let link = region === 'uk' ? `https://www.trade-tariff.service.gov.uk/commodities/${cleanCode}` : 'https://ec.europa.eu/taxation_customs/dds2/taric/taric_consultation.jsp';
        let linkText = region === 'uk' ? 'View Duty & VAT on HMRC Tariff ↗' : 'Verify Live on EU TARIC ↗';

        output.innerHTML = `
            <p><strong>Product:</strong> ${prodInput} | <strong>Origin:</strong> ${cooInput || 'General'}</p>
            <p><strong>Recommended 10-Digit HS Code:</strong> <span style="color:#d32f2f; font-size:18px; font-weight:bold;">${aiResult.code}</span></p>
            <p><strong>Compliance Description:</strong> ${aiResult.desc}</p>
            <a href="${link}" target="_blank" class="official-link">${linkText}</a>
        `;
        resultBox.style.display = 'block';
    }
</script>

</body>
</html>
