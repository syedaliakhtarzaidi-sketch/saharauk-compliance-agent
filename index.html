<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Trade & Tariff AI | Fixed Compliance Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .tab-btn.active { border-bottom: 3px solid #0284c7; color: #0284c7; font-weight: 700; }
        .tab-btn { border-bottom: 3px solid transparent; color: #64748b; font-weight: 600; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

    <header class="bg-white border-b border-slate-200 py-4 px-6 md:px-12 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-slate-900 text-white p-2.5 rounded-xl shadow-md">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-900 leading-tight">Global Trade & Tariff AI</h1>
                <p class="text-xs text-slate-500 font-medium">HMRC & EU TARIC Automated Compliance Engine</p>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full px-4 py-8 flex-1">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 mb-8 overflow-hidden">
            <div class="flex border-b border-slate-100 bg-slate-50/50">
                <button onclick="switchTab('UK')" id="tab-UK" class="tab-btn active px-8 py-4 text-sm transition-all">UK Entity (HMRC)</button>
                <button onclick="switchTab('EU')" id="tab-EU" class="tab-btn px-8 py-4 text-sm transition-all">Estonia Entity (EU TARIC)</button>
            </div>

            <div class="p-6 md:p-8">
                <div class="bg-slate-50/80 rounded-2xl p-6 border border-slate-200/80">
                    <form id="complianceForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Product Name:</label>
                            <input type="text" id="productName" required placeholder="e.g. date paste, date syrup, chopped dates" class="w-full px-4 py-3.5 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Country of Origin (COO):</label>
                            <input type="text" id="countryOrigin" required placeholder="e.g. UAE, Pakistan, USA" class="w-full px-4 py-3.5 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
                        </div>
                        <button type="submit" class="w-full bg-[#0b2545] hover:bg-[#134074] text-white font-bold py-4 px-6 rounded-xl transition-all text-sm">🤖 Ask AI Compliance Agent</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="resultsCard" class="hidden space-y-6">
            <div class="bg-slate-900 text-white rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h2 id="resultTitle" class="text-2xl font-bold"></h2>
                    <p id="resultTimestamp" class="text-xs text-slate-400 mt-1 font-mono"></p>
                </div>
                <a id="verifyLink" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-3 rounded-xl transition">Verify Live</a>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">COMMODITY CODE</div>
                    <div id="resCode" class="text-3xl font-extrabold text-indigo-700 font-mono mb-2"></div>
                    <p id="resCodeDesc" class="text-xs text-slate-500"></p>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">CUSTOMS DUTY RATE</div>
                    <div id="resDuty" class="text-3xl font-extrabold text-emerald-600 mb-2"></div>
                    <p id="resDutyDesc" class="text-xs text-slate-500"></p>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">IMPORT VAT RATE</div>
                    <div id="resVat" class="text-3xl font-extrabold text-violet-600 mb-2"></div>
                    <p id="resVatDesc" class="text-xs text-slate-500"></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentTab = 'UK';

        // Updated Database with Precise Order Priorities
        const TARIFF_DB = [
            // 1. Date Paste (UAE)
            {
                pattern: /\b(date paste|date puree)\b/i,
                cooPattern: /\b(uae|united arab emirates|dubai)\b/i,
                code: '2008999990',
                ukDuty: '12.0%',
                euDuty: '12.0%',
                ukVat: '0.0% (Zero-Rated)',
                euVat: '22.0%',
                desc: 'Dates, prepared or preserved (Date Paste) under Chapter 20.',
                dutyDesc: 'Standard Third-Country Tariff (12%) for UAE origin processed fruit paste.',
                vatDesc: 'Zero-rated human food ingredient in UK.'
            },
            // 2. Date Syrup (UAE)
            {
                pattern: /\b(date syrup|dibs|date honey)\b/i,
                cooPattern: /\b(uae|united arab emirates|dubai)\b/i,
                code: '1702909590',
                ukDuty: '16.0%',
                euDuty: '16.0%',
                ukVat: '0.0% (Zero-Rated)',
                euVat: '22.0%',
                desc: 'Date Syrup / Dibs containing sugar extracts under Heading 1702.',
                dutyDesc: 'Standard Third-Country Tariff (16%) for UAE origin sugar syrups.',
                vatDesc: 'Zero-rated human food ingredient in UK.'
            },
            // 3. Raw / Chopped Dates (Pakistan)
            {
                pattern: /\b(chopped dates|pitted dates|raw dates|dates|khajoor)\b/i,
                cooPattern: /\b(pakistan|pk)\b/i,
                code: '0804100000',
                ukDuty: '0.0%',
                euDuty: '0.0%',
                ukVat: '0.0% (Zero-Rated)',
                euVat: '22.0%',
                desc: 'Dates, fresh or dried, whether or not pitted or chopped (Chapter 8).',
                dutyDesc: '0% Preferential Duty under UK DCTS Scheme for Pakistan.',
                vatDesc: 'Zero-rated human food product.'
            }
        ];

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-UK').classList.toggle('active', tab === 'UK');
            document.getElementById('tab-EU').classList.toggle('active', tab === 'EU');
            if (!document.getElementById('resultsCard').classList.contains('hidden')) executeSearch();
        }

        function handleFormSubmit(e) { e.preventDefault(); executeSearch(); }

        function executeSearch() {
            const prod = document.getElementById('productName').value.trim();
            const coo = document.getElementById('countryOrigin').value.trim();

            let match = TARIFF_DB.find(item => item.pattern.test(prod) && item.cooPattern.test(coo));
            if (!match) match = TARIFF_DB.find(item => item.pattern.test(prod));

            if (!match) {
                match = {
                    code: '2008999990',
                    ukDuty: '12.0%',
                    euDuty: '12.0%',
                    ukVat: '0.0%',
                    euVat: '22.0%',
                    desc: 'Processed fruit paste / date product.',
                    dutyDesc: 'Standard Third-Country duty rate.',
                    vatDesc: 'Foodstuff VAT classification.'
                };
            }

            const resultsCard = document.getElementById('resultsCard');
            resultsCard.classList.remove('hidden');
            document.getElementById('resultTitle').innerText = `${prod} (Origin: ${coo.toUpperCase()})`;
            document.getElementById('resultTimestamp').innerText = `🕒 Query timestamp: ${new Date().toLocaleTimeString()}`;
            document.getElementById('resCode').innerText = match.code;
            document.getElementById('resCodeDesc').innerText = match.desc;
            document.getElementById('resDuty').innerText = currentTab === 'UK' ? match.ukDuty : match.euDuty;
            document.getElementById('resDutyDesc').innerText = match.dutyDesc;
            document.getElementById('resVat').innerText = currentTab === 'UK' ? match.ukVat : match.euVat;
            document.getElementById('resVatDesc').innerText = match.vatDesc;

            const verifyLink = document.getElementById('verifyLink');
            verifyLink.innerText = `Verify Live on ${currentTab === 'UK' ? 'UK HMRC' : 'EU TARIC'} (${match.code})`;
            verifyLink.href = currentTab === 'UK' 
                ? `https://www.trade-tariff.service.gov.uk/commodities/${match.code}`
                : `https://ec.europa.eu/taxation_customs/dds2/taric/taric_consultation.jsp?Taric=${match.code}`;
        }
    </script>
</body>
</html>
